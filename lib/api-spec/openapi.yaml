openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Operational overview
  - name: services
    description: Wash service catalog
  - name: orders
    description: Vehicle orders
  - name: payments
    description: Order payments
  - name: audit
    description: Security audit trail
  - name: users
    description: Administrator-controlled user access
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get operating dashboard
      responses:
        "200":
          description: Current operating metrics and recent orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /services:
    get:
      operationId: getServices
      tags: [services]
      summary: List catalog services including paused entries
      responses:
        "200":
          description: Service catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      tags: [services]
      summary: Add a wash service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Service created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
  /services/{id}:
    patch:
      operationId: updateService
      tags: [services]
      summary: Edit a catalog service
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
    delete:
      operationId: deleteService
      tags: [services]
      summary: Remove a service from the active catalog
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Service deactivated while keeping order history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
  /orders:
    get:
      operationId: getOrders
      tags: [orders]
      summary: List vehicle orders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Vehicle orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new vehicle order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Vehicle order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Update customer details or order price
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{id}/status:
    post:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Move an order to the next operational status
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{id}/payment:
    post:
      operationId: recordPayment
      tags: [payments]
      summary: Record a payment against an order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "200":
          description: Paid order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /audit:
    get:
      operationId: getAuditEvents
      tags: [audit]
      summary: List security audit events
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
  /users:
    get:
      operationId: getUsers
      tags: [users]
      summary: List EcoClean users
      responses:
        "200":
          description: Current user accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserAccount"
    post:
      operationId: inviteUser
      tags: [users]
      summary: Invite a collaborator to EcoClean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: User invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
  /bootstrap:
    get:
      operationId: getBootstrapStatus
      tags: [users]
      summary: Check whether the first administrator can be created
      responses:
        "200":
          description: Bootstrap status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapStatus"
  /users/{id}:
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a collaborator account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: User deleted
components:
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Service:
      type: object
      required: [id, name, description, category, price, priceSmall, priceMedium, priceLarge, active]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        category:
          $ref: "#/components/schemas/ServiceCategory"
        price: { type: integer, minimum: 0 }
        priceSmall: { type: integer, minimum: 0 }
        priceMedium: { type: integer, minimum: 0 }
        priceLarge: { type: integer, minimum: 0 }
        active: { type: boolean }
    ServiceInput:
      type: object
      required: [name, description, category, priceSmall, priceMedium, priceLarge]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        category:
          $ref: "#/components/schemas/ServiceCategory"
        priceSmall: { type: integer, minimum: 0 }
        priceMedium: { type: integer, minimum: 0 }
        priceLarge: { type: integer, minimum: 0 }
    ServiceUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        category:
          $ref: "#/components/schemas/ServiceCategory"
        priceSmall: { type: integer, minimum: 0 }
        priceMedium: { type: integer, minimum: 0 }
        priceLarge: { type: integer, minimum: 0 }
        active: { type: boolean }
    ServiceCategory:
      type: string
      enum: [LAVADO, ADICIONAL, ESPECIALIZADO, GENERAL]
    VehicleSize:
      type: string
      enum: [PEQUENO, MEDIANO, GRANDE]
    OrderStatus:
      type: string
      enum: [INGRESADO, EN_SERVICIO, LISTO, PENDIENTE_DE_PAGO, PAGADO, ENTREGADO, ANULADO]
    PaymentMethod:
      type: string
      enum: [EFECTIVO, DEBITO, CREDITO]
    Order:
      type: object
      required: [id, number, plate, customer, phone, serviceId, serviceName, vehicleSize, price, status, createdAt, updatedAt, enteredBy, lastActionBy, paymentMethod, barcode]
      properties:
        id: { type: integer }
        number: { type: string }
        plate: { type: string }
        customer: { type: string }
        phone: { type: string }
        serviceId: { type: integer }
        serviceName: { type: string }
        vehicleSize:
          $ref: "#/components/schemas/VehicleSize"
        price: { type: integer, minimum: 0 }
        status:
          $ref: "#/components/schemas/OrderStatus"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        enteredBy: { type: string }
        lastActionBy: { type: string }
        paymentMethod:
          type: ["string", "null"]
          enum: [EFECTIVO, DEBITO, CREDITO, null]
        barcode: { type: string }
    OrderInput:
      type: object
      required: [plate, customer, phone, serviceIds, vehicleSize]
      properties:
        plate: { type: string, minLength: 2 }
        customer: { type: string, minLength: 1 }
        phone: { type: string }
        serviceIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        vehicleSize:
          $ref: "#/components/schemas/VehicleSize"
        priceOverride: { type: ["integer", "null"], minimum: 0 }
    OrderUpdate:
      type: object
      properties:
        customer: { type: string }
        phone: { type: string }
        priceOverride: { type: ["integer", "null"], minimum: 0 }
        reason: { type: ["string", "null"] }
    OrderStatusInput:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/OrderStatus"
        reason: { type: ["string", "null"] }
    PaymentInput:
      type: object
      required: [method]
      properties:
        method:
          $ref: "#/components/schemas/PaymentMethod"
        amount: { type: ["integer", "null"], minimum: 0 }
    AuditEvent:
      type: object
      required: [id, action, description, actor, timestamp, severity]
      properties:
        id: { type: integer }
        action: { type: string }
        description: { type: string }
        actor: { type: string }
        timestamp: { type: string, format: date-time }
        severity:
          type: string
          enum: [INFO, WARNING, CRITICAL]
    UserRole:
      type: string
      enum: [ADMIN, SUPERVISOR, CAJERO, OPERADOR]
    UserStatus:
      type: string
      enum: [INVITADO, ACTIVO, BLOQUEADO]
    UserAccount:
      type: object
      required: [id, email, firstName, lastName, role, status, createdAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          $ref: "#/components/schemas/UserStatus"
        createdAt: { type: string, format: date-time }
        invitationId: { type: ["string", "null"] }
    UserInput:
      type: object
      required: [email, firstName, lastName, role]
      properties:
        email: { type: string, format: email }
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        role:
          $ref: "#/components/schemas/UserRole"
    BootstrapStatus:
      type: object
      required: [allowed]
      properties:
        allowed: { type: boolean }
    Dashboard:
      type: object
      required: [todaySales, todayOrders, pendingPayment, readyVehicles, deliveredToday, cashExpected, cashByMethod, statusCounts, recentOrders, recentActivity]
      properties:
        todaySales: { type: integer }
        todayOrders: { type: integer }
        pendingPayment: { type: integer }
        readyVehicles: { type: integer }
        deliveredToday: { type: integer }
        cashExpected: { type: integer }
        cashByMethod:
          type: object
          required: [EFECTIVO, DEBITO, CREDITO]
          properties:
            EFECTIVO: { type: integer }
            DEBITO: { type: integer }
            CREDITO: { type: integer }
        statusCounts:
          type: object
          additionalProperties: { type: integer }
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"

